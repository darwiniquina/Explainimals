name: CI

# Runs the test suite on every push (any branch) and on every pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

# The tests only read the repo; nothing here needs write access.
permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 18 is the minimum the skill documents; 22 is a current LTS.
        node: [18, 22]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show versions
        run: |
          node --version
          npm --version

      # No dependencies to install: the suite uses only Node's built-in test runner.
      - name: Run the tests
        run: npm test
